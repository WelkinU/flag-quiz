[project]
name = "flag-quiz"
version = "0.1.0"
description = "A flag guessing quiz built with PyQt5"
requires-python = ">=3.10"
dependencies = [
    "PyQt5>=5.15,<=5.15.10",
    "pyqt5-qt5>=5.15.2,<=5.15.3",
    "requests>=2.31",
]

[project.scripts]
flag-quiz = "flag_quiz.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flag_quiz"]
